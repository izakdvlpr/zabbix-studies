name: observability

x-zbx-db-env: &zbx-db-env
  DB_SERVER_HOST: zabbix-db
  DB_SERVER_PORT: 5432
  POSTGRES_USER: zabbix
  POSTGRES_PASSWORD: k7*$5x3aTG^rRh9x
  POSTGRES_DB: zabbix

services:
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: k7*$5x3aTG^rRh9x
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [observability]
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-alpine-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      <<: *zbx-db-env
      ZBX_CACHESIZE: 64M
      ZBX_STARTPOLLERS: 5
      ZBX_TIMEOUT: 10
    ports:
      - "10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [observability]
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-alpine-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      <<: *zbx-db-env
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8065:8080"
    depends_on:
      - zabbix-server
    networks: [observability]
  zabbix-agent:
    image: zabbix/zabbix-agent2:7.0-alpine-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: app-stack
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_TIMEOUT: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability
  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Yzp^tWB9u7tbE!96
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "8068:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - zabbix-web
    networks: [observability]

volumes:
  zabbix-db-data:
  grafana-data:

networks:
  observability:
    driver: bridge